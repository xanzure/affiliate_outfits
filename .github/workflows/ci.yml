name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # The suite is hermetic: tests use local sqlite temp DBs and no network.
        # The 2 full-pipeline tests that hit the real Claude API auto-skip unless
        # ANTHROPIC_API_KEY is present (see tests/pipelines/test_daily_pipeline.py).
        # To also run those, add an ANTHROPIC_API_KEY repo secret and uncomment:
        #   env:
        #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -q

  dashboard:
    name: dashboard (vitest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Supabase is mocked in every test (tests/fakeSupabase.ts) — no keys needed.
      - name: Unit tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit
